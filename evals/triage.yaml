# The track's triage question, on messages whose answers we know.
# desk eval evals/triage.yaml --models claude-haiku-5-5,claude-sonnet-5-5,jev-latest --runs 3
eval: triage
kind: classify
policy: ../track/policy.yaml
trigger: triage
models: [claude-haiku-5-5]
runs: 3
cases:
  - name: pay a bill
    text: "Please pay my Brightwell Energy bill, it's £120."
    expect: { category: payment }
  - name: balance question
    text: "What is my balance after the last payment went out?"
    expect: { category: question }
  - name: disputed charge
    text: "You charged me twice for the same bill and I want it fixed."
    expect: { category: complaint }
