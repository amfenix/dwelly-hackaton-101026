<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desk Results</title>
<style>
:root { color-scheme: dark; --ink:#e7e9f0; --dim:#9aa2b5; --line:#262a35; --panel:#14161d; --bg:#0b0c10; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink);
  font:13px/1.5 ui-sans-serif, system-ui, sans-serif; }
.bar { position:sticky; top:0; z-index:5; display:flex; gap:20px; align-items:center;
  flex-wrap:wrap; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
.bar strong { font-size:14px; }
.count { margin-left:auto; color:var(--dim); font-variant-numeric:tabular-nums; }
.seg { display:flex; align-items:center; gap:8px; }
.seg > span { color:var(--dim); }
.seg > div { display:flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; }
.seg button { background:none; border:0; border-left:1px solid var(--line); color:var(--dim);
  font:inherit; padding:4px 10px; cursor:pointer; }
.seg button:first-child { border-left:0; }
.seg button:hover { color:var(--ink); }
.seg button[aria-pressed="true"] { background:#4a7cf7; color:#fff; }
#sheet { display:flex; flex-wrap:wrap; gap:34px; padding:28px 16px 120px; align-items:flex-start; }
.cell[hidden] { display:none; }
.cap-top { margin-bottom:8px; font-size:14px; }
.cap-top span { color:var(--dim); margin-left:8px; font-size:12px; }
.frame { border:1px solid rgba(255,255,255,.13); overflow:hidden; background:#0f1117;
  box-shadow:0 20px 60px rgba(0,0,0,.35); }
/* A phone reads as a phone and a window as a window; getting this wrong makes
   every screen look like the wrong device at a glance. */
.frame--mobile { border-radius:26px; }
.frame--desktop { border-radius:10px; }
.frame iframe { border:0; display:block; }
.cap { margin-top:10px; color:var(--dim); max-width:390px; }
.links { margin:8px 0 0; padding:0; list-style:none; color:var(--dim); max-width:390px; }
.links li { padding:1px 0; }
.links li.assumed { opacity:.65; font-style:italic; }
.links li.assumed::after { content:' (assumed)'; opacity:.7; font-style:normal; }
</style>
</head>
<body>
<header class="bar">
  <strong>Desk Results</strong>
  <div class="seg" data-filter="group"><span>Flow</span><div><button data-value="" aria-pressed="true">All</button><button data-value="review">Review a desk run</button></div></div>
  <div class="seg" data-filter="viewport"><span>Size</span><div><button data-value="desktop" aria-pressed="true">Desktop</button><button data-value="mobile">Mobile</button></div></div>
  <span class="count"><b id="shown">4</b> / 4 screens</span>
</header>
<main id="sheet">
<figure class="cell" data-viewport="desktop" data-theme="light"
 data-locale="en" data-group="review"
 data-item="results">
<figcaption class="cap-top"><b>Results overview</b><span>results</span></figcaption>
<div class="frame frame--desktop" style="width:1440px;height:900px">
<iframe loading="lazy" src="screens/results@desktop.html" title="Results overview"
 width="1440" height="900"></iframe></div>

<ul class="links"><li>Review handoffs &rarr; Handoff queue</li><li>Inspect decision &rarr; Case review</li><li>Understand the policy &rarr; Policy explorer</li></ul>
</figure>
<figure class="cell" data-viewport="mobile" data-theme="light"
 data-locale="en" data-group="review"
 data-item="results">
<figcaption class="cap-top"><b>Results overview</b><span>results</span></figcaption>
<div class="frame frame--mobile" style="width:390px;height:844px">
<iframe loading="lazy" src="screens/results@mobile.html" title="Results overview"
 width="390" height="844"></iframe></div>

<ul class="links"><li>Review handoffs &rarr; Handoff queue</li><li>Inspect decision &rarr; Case review</li><li>Understand the policy &rarr; Policy explorer</li></ul>
</figure>
<figure class="cell" data-viewport="desktop" data-theme="light"
 data-locale="en" data-group="review"
 data-item="handoffs">
<figcaption class="cap-top"><b>Handoff queue</b><span>handoffs</span></figcaption>
<div class="frame frame--desktop" style="width:1440px;height:900px">
<iframe loading="lazy" src="screens/handoffs@desktop.html" title="Handoff queue"
 width="1440" height="900"></iframe></div>

<ul class="links"><li>Open case #002 &rarr; Case review</li></ul>
</figure>
<figure class="cell" data-viewport="mobile" data-theme="light"
 data-locale="en" data-group="review"
 data-item="handoffs">
<figcaption class="cap-top"><b>Handoff queue</b><span>handoffs</span></figcaption>
<div class="frame frame--mobile" style="width:390px;height:844px">
<iframe loading="lazy" src="screens/handoffs@mobile.html" title="Handoff queue"
 width="390" height="844"></iframe></div>

<ul class="links"><li>Open case #002 &rarr; Case review</li></ul>
</figure>
<figure class="cell" data-viewport="desktop" data-theme="light"
 data-locale="en" data-group="review"
 data-item="case-review">
<figcaption class="cap-top"><b>Case review</b><span>case-review</span></figcaption>
<div class="frame frame--desktop" style="width:1440px;height:900px">
<iframe loading="lazy" src="screens/case-review@desktop.html" title="Case review"
 width="1440" height="900"></iframe></div>

<ul class="links"><li>Explore the governing rules &rarr; Policy explorer</li></ul>
</figure>
<figure class="cell" data-viewport="mobile" data-theme="light"
 data-locale="en" data-group="review"
 data-item="case-review">
<figcaption class="cap-top"><b>Case review</b><span>case-review</span></figcaption>
<div class="frame frame--mobile" style="width:390px;height:844px">
<iframe loading="lazy" src="screens/case-review@mobile.html" title="Case review"
 width="390" height="844"></iframe></div>

<ul class="links"><li>Explore the governing rules &rarr; Policy explorer</li></ul>
</figure>
<figure class="cell" data-viewport="desktop" data-theme="light"
 data-locale="en" data-group="review"
 data-item="policy-explorer">
<figcaption class="cap-top"><b>Policy explorer</b><span>policy-explorer</span></figcaption>
<div class="frame frame--desktop" style="width:1440px;height:900px">
<iframe loading="lazy" src="screens/policy-explorer@desktop.html" title="Policy explorer"
 width="1440" height="900"></iframe></div>


</figure>
<figure class="cell" data-viewport="mobile" data-theme="light"
 data-locale="en" data-group="review"
 data-item="policy-explorer">
<figcaption class="cap-top"><b>Policy explorer</b><span>policy-explorer</span></figcaption>
<div class="frame frame--mobile" style="width:390px;height:844px">
<iframe loading="lazy" src="screens/policy-explorer@mobile.html" title="Policy explorer"
 width="390" height="844"></iframe></div>


</figure>
</main>
<script>
(function () {
  var UNGROUPED = "__none__";
  var state = {};
  document.querySelectorAll('.seg').forEach(function (seg) {
    var key = seg.dataset.filter;
    state[key] = seg.querySelector('button').dataset.value;
    seg.addEventListener('click', function (e) {
      var button = e.target.closest('button');
      if (!button) return;
      state[key] = button.dataset.value;
      seg.querySelectorAll('button').forEach(function (b) {
        b.setAttribute('aria-pressed', String(b === button));
      });
      apply();
    });
  });
  function apply() {
    // Count screens, not cells. One screen has a cell per size and per theme,
    // so counting cells reported 248 for a design of 62 screens — a number
    // that answers a question nobody asked.
    var seen = {};
    document.querySelectorAll('.cell').forEach(function (cell) {
      var ok = Object.keys(state).every(function (key) {
        var want = state[key];
        if (want === '') return true;
        if (want === UNGROUPED) return cell.dataset[key] === '';
        return cell.dataset[key] === want;
      });
      cell.hidden = !ok;
      if (ok) seen[cell.dataset.item] = true;
    });
    document.getElementById('shown').textContent = String(Object.keys(seen).length);
  }
  apply();
})();
</script>
</body>
</html>
