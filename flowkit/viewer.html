gation\"><x-desk-sidebar variant=\"review\"/><\/x-fill><x-fill slot=\"breadcrumb\"><span data-t=\"ui.149\">Results / Case #002<\/span><\/x-fill><x-fill slot=\"body\"><div class=\"case-review\"><a class=\"case-review__back\" href=\"#results\"><span data-t=\"ui.99\">← All results<\/span><\/a><x-desk-heading><x-fill slot=\"eyebrow\"><span data-t=\"ui.100\">03 / INSIDE A DECISION<\/span><\/x-fill><x-fill slot=\"title\"><span data-t=\"ui.101\">The £350 question.<\/span><\/x-fill><x-fill slot=\"subtitle\"><span data-t=\"ui.102\">A request, a limit, and the rule that draws the line.<\/span><\/x-fill><x-fill slot=\"action\"><x-desk-badge variant=\"warning\"><x-fill slot=\"label\"><span data-t=\"ui.103\">Needs a person<\/span><\/x-fill><\/x-desk-badge><\/x-fill><\/x-desk-heading><div class=\"case-review__banner\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l8 3v6c0 5-8 9-8 9s-8-4-8-9V6z M8 12l3 3 5-6\"/><\/svg><div><strong data-t=\"ui.104\">Handed off by the policy<\/strong><p data-t=\"ui.105\">The requested £350 exceeds Ben’s £100 limit. A person must decide what happens next.<\/p><\/div><code data-t=\"ui.106\">OVER_LIMIT<\/code><\/div><div class=\"case-review__columns\"><div class=\"case-review__left\"><section class=\"case-review__panel\"><h2 data-t=\"ui.107\">The request<\/h2><p data-t=\"ui.108\" class=\"case-review__muted\">ben.hart@example.com<\/p><blockquote data-t=\"ui.109\">“Pay Brightwell Energy £350 today please.”<\/blockquote><\/section><section class=\"case-review__panel\"><div class=\"case-review__panelhead\"><h2 data-t=\"ui.110\">Established facts<\/h2><span data-t=\"ui.111\">From records, not agent text<\/span><\/div><div class=\"case-review__facts\"><div><small data-t=\"ui.112\">Customer<\/small><strong data-t=\"ui.113\">Ben Hart<\/strong><code data-t=\"ui.114\">world.customers · C-2<\/code><\/div><div><s :var(--text-muted);background:var(--surface-2);padding:var(--space-1) var(--space-2);border-radius:var(--radius-sm)}.policy-rule__plus{font-size:var(--text-xl);font-weight:normal;color:var(--accent)}.policy-rule[open] .policy-rule__plus{transform:rotate(45deg)}.policy-rule__body{padding:0 var(--space-7) var(--space-5);display:grid;gap:var(--space-4)}.policy-rule__explanation{font-size:var(--text-sm);color:var(--text-muted)}.policy-rule__logic{background:var(--ink);color:var(--cream);padding:var(--space-4);border-radius:var(--radius-sm)}.policy-rule__logic small{display:block;color:var(--lime);font-size:var(--text-tiny);letter-spacing:var(--letter-wide);margin-bottom:var(--space-2)}.policy-rule__logic code{font-size:var(--text-xs);overflow-wrap:anywhere}.policy-rule__effect small{display:block;color:var(--accent);font-size:var(--text-tiny);letter-spacing:var(--letter-wide);margin-bottom:var(--space-2)}.policy-rule__effect p{font-size:var(--text-sm)}@media(max-width:800px){.policy-rule summary{gap:var(--space-3);flex-wrap:wrap}.policy-rule__intro{flex-basis:70%}.policy-rule__type{margin-left:var(--space-6)}.policy-rule__body{padding:0 0 var(--space-5)}.policy-rule__plus{margin-left:auto}}"},"policy-explorer":{"tier":"screen","html":"<x-desk-shell><x-fill slot=\"navigation\"><x-desk-sidebar variant=\"policy\"/><\/x-fill><x-fill slot=\"body\"><div class=\"policy-explorer\"><x-desk-heading><x-fill slot=\"eyebrow\"><span data-t=\"policy.60\">04 / THE POLICY, OPENED UP<\/span><\/x-fill><x-fill slot=\"title\"><span data-t=\"policy.61\">What’s inside the decision?<\/span><\/x-fill><x-fill slot=\"subtitle\"><span data-t=\"policy.62\">Explore the facts, rules, and boundaries of the payments desk.<\/span><\/x-fill><x-fill slot=\"action\"><code data-t=\"policy.63\" class=\"policy-explorer__version\">payments-desk / v1<\/code><\/x-fill><\/x-desk-heading><nav class=\"policy-explorer__jump\"><a href=\"#journey\"><span data-t=\"policy.64\">The journey<\/span><\/a><a href=\"#rules\"><span data-t=\"policy.65\">8 rules<\/span><\/a><a href=\"#facts\"><span data-t=\"policy.66\">7 facts<\/span><\/a><a href=\"#signals\"><span data-t=\"policy.67\">2 agent tools<\/span><\/a><a href=\"#safety\"><span data-t=\"policy.68\">Safeguards<\/span><\/a><a href=\"#source\"><span data-t=\"policy.69\">Read the YAML<\/span><\/a><\/nav><section class=\"policy-explorer__principle\"><div><small data-t=\"policy.70\">THE CONTRACT<\/small><h2><span data-t=\"policy.contract1\">The agent asks.<\/span><br><span data-t=\"policy.contract2\">The policy decides.<\/span><\/h2><\/div><div><p data-t=\"policy.72\">Pay a known payee, within the customer’s limit. Hand everything else to a person, with the facts attached.<\/p><small data-t=\"policy.73\">Source: track/policy.yaml · version 1 · read-only explorer<\/small><\/div><\/section><section id=\"journey\" class=\"policy-explorer__section\"><div class=\"policy-explorer__sectionhead\"><div><small data-t=\"policy.74\">01 / FOLLOW THE STATE<\/small><h2 data-t=\"policy.75\">From request to outcome.<\/h2><\/div><p data-t=\"policy.76\">Select a state to jump to its rule.<\/p><\/div><div class=\"policy-explorer__flow\"><a href=\"#rule-identify\" class=\"policy-explorer__state\"><small data-t=\"policy.77\">01<\/small><code data-t=\"policy.78\">NEW<\/code><span data-t=\"policy.79\">Start here<\/span><\/a><a href=\"#rule-unknown-customer\" class=\"policy-explorer__state\"><small data-t=\"policy.80\">02<\/small><code data-t=\"policy.81\">IDENTIFIED<\/code><span data-t=\"policy.82\">Check identity<\/span><\/a><a href=\"#rule-pay-requested\" class=\"policy-explorer__state\"><small data-t=\"policy.83\">03<\/small><code data-t=\"policy.84\">TRIAGED<\/code><span data-t=\"policy.85\">Check the request<\/span><\/a><a href=\"#rule-pay\" class=\"policy-explorer__state\"><small data-t=\"policy.86\">04<\/small><code data-t=\"policy.87\">PAYING<\/code><span data-t=\"policy.88\">Execute once per visit<\/span><\/a><a href=\"#rule-pay\" class=\"policy-explorer__state policy-explorer__state--done\"><small data-t=\"policy.89\">05<\/small><code data-t=\"policy.90\">DONE<\/code><span data-t=\"policy.91\">Outcome: act<\/span><\/a><\/div><div class=\"policy-explorer__branch\"><span data-t=\"policy.92\">↳<\/span><code data-t=\"policy.93\">ESCALATED<\/code><strong data-t=\"policy.94\">Outcome: escalate<\/strong><p data-t=\"policy.95\">Unknown customer, unknown payee, over limit, agent handoff, failure, or stall.<\/p><\/div><p class=\"policy-explorer__hint\"><span data-t=\"policy.96\">This shows the main payment path. The escalate signal can move any non-ESCALATED state to ESCALATED, including DONE; final states are outcomes, not immutable locks.<\/span><\/p><\/section><section id=\"rules\" class=\"policy-explorer__section\"><div class=\"policy-explorer__sectionhead\"><div><small data-t=\"policy.97\">02 / OPEN THE RULEBOOK<\/small><h2 data-t=\"policy.98\">Eight rules. No hidden permission.<\/h2><\/div><p data-t=\"policy.99\">Expand a rule to see its exact condition.<\/p><\/div><div class=\"policy-explorer__ordering\"><strong data-t=\"policy.100\">Order matters.<\/strong><p data-t=\"policy.101\">Automatic rules are checked in file order; the first true condition fires. Signal rules respond to a matching agent tool call. Unknown facts do not make a condition true.<\/p><\/div><fieldset class=\"policy-explorer__filters\"><legend><span data-t=\"policy.102\">Filter policy rules<\/span><\/legend><label><input type=\"radio\" name=\"policy-kind\" value=\"all\" checked><span data-t=\"policy.103\">All rules · 8<\/span><\/label><label><input type=\"radio\" name=\"policy-kind\" value=\"automatic\"><span data-t=\"policy.104\">Automatic · 6<\/span><\/label><label><input type=\"radio\" name=\"policy-kind\" value=\"signal\"><span data-t=\"policy.105\">Agent signals · 2<\/span><\/label><\/fieldset><div class=\"policy-explorer__rule-list\"><div class=\"policy-explorer__rule-wrap\" id=\"rule-identify\" data-kind=\"automatic\"><x-policy-rule><x-fill slot=\"number\"><span data-t=\"policy.4\">01<\/span><\/x-fill><x-fill slot=\"name\"><code data-t=\"policy.5\">identify<\/code><\/x-fill><x-fill slot=\"title\"><span data-t=\"policy.6\">Find the customer<\/span><\/x-fill><x-fill slot=\"type\"><span data-t=\"policy.7\">Automatic<\/span><\/x-fill><x-fill slot=\"description\"><p data-t=\"policy.8\">Look up the sender in the records before deciding anything.<\/p><\/x-fill><x-fill slot=\"condition\"><code data-t=\"policy.9\">state = NEW<\/code><\/x-fill><x-fill slot=\"effect\"><p data-t=\"policy.10\">Call find_customer, then move to IDENTIFIED.<\/p><\/x-fill><\/x-policy-rule><\/div><div class=\"policy-explorer__rule-wrap\" id=\"rule-unknown-customer\" data-kind=\"automatic\"><x-policy-rule><x-fill slot=\"number\"><span data-t=\"policy.11\">02<\/span><\/x-fill><x-fill slot=\"name\"><code data-t=\"policy.12\">unknown-customer<\/code><\/x-fill><x-fill slot=\"title\"><span data-t=\"policy.13\">Stop if identity is missing<\/span><\/x-fill><x-fill slot=\"type\"><span data-t=\"policy.14\">Automatic<\/span><\/x-fill><x-fill slot=\"description\"><p data-t=\"policy.15\">A sender without a matching customer record goes to a person.<\/p><\/x-fill><x-fill slot=\"condition\"><code data-t=\"policy.16\">state = IDENTIFIED and customer absent<\/code><\/x-fill><x-fill slot=\"effect\"><p data-t=\"policy.17\">Set reason = UNKNOWN_CUSTOMER; move to ESCALATED.<\/p><\/x-fill><\/x-policy-rule><\/div><div class=\"policy-explorer__rule-wrap\" id=\"rule-triage\" data-kind=\"automatic\"><x-policy-rule><x-fill slot=\"number\"><span data-t=\"policy.18\">03<\/span><\/x-fill><x-fill slot=\"name\"><code data-t=\"policy.19\">triage<\/code><\/x-fill><x-fill slot=\"title\"><span data-t=\"policy.20\">Understand the request<\/span><\/x-fill><x-fill slot=\"type\"><span data-t=\"policy.21\">Automatic<\/span><\/x-fill><x-fill slot=\"description\"><p data-t=\"policy.22\">Classify the message as payment, question, complaint, or other.<\/p><\/x-fill><x-fill slot=\"condition\"><code data-t=\"policy.23\">state = IDENTIFIED and customer present<\/code><\/x-fill><x-fill slot=\"effect\"><p data-t=\"policy.24\">Ask the category question; allow 1 retry; move to TRIAGED.<\/p><\/x-fill><\/x-policy-rule><\/div><div class=\"policy-explorer__rule-wrap\" id=\"rule-unknown-payee\" data-kind=\"automatic\"><x-policy-rule><x-fill slot=\"number\"><span data-t=\"policy.25\">04<\/span><\/x-fill><x-fill slot=\"name\"><code data-t=\"policy.26\">unknown-payee<\/code><\/x-fill><x-fill slot=\"title\"><span data-t=\"policy.27\">Keep unknown recipients out<\/span><\/x-fill><x-fill slot=\"type\"><span data-t=\"policy.28\">Automatic<\/span><\/x-fill><x-fill slot=\"description\"><p data-t=\"policy.29\">A payment to a payee absent from the customer’s saved records needs review.<\/p><\/x-fill><x-fill slot=\"condition\"><code data-t=\"policy.30\">state = TRIAGED and category = payment and payee absent<\/code><\/x-fill><x-fill slot=\"effect\"><p data-t=\"policy.31\">Set reason = UNKNOWN_PAYEE; move to ESCALATED.<\/p><\/x-fill><\/x-policy-rule><\/div><div class=\"policy-explorer__rule-wrap\" id=\"rule-over-limit\" data-kind=\"automatic\"><x-policy-rule><x-fill slot=\"number\"><span data-t=\"policy.32\">05<\/span><\/x-fill><x-fill slot=\"name\"><code data-t=\"policy.33\">over-limit<\/code><\/x-fill><x-fill slot=\"title\"><span data-t=\"policy.34\">Respect the customer’s limit<\/span><\/x-fill><x-fill slot=\"type\"><span data-t=\"policy.35\">Automatic<\/span><\/x-fill><x-fill slot=\"description\"><p data-t=\"policy.36\">The amount is checked against the recorded limit, not a limit suggested in the message.<\/p><\/x-fill><x-fill slot=\"condition\"><code data-t=\"policy.37\">state = TRIAGED and category = payment and amount &gt; limit<\/code><\/x-fill><x-fill slot=\"effect\"><p data-t=\"policy.38\">Set reason = OVER_LIMIT; move to ESCALATED.<\/p><\/x-fill><\/x-policy-rule><\/div><div class=\"policy-explorer__rule-wrap\" id=\"rule-pay-requested\" data-kind=\"signal\"><x-policy-rule><x-fill slot=\"number\"><span data-t=\"policy.39\">06<\/span><\/x-fill><x-fill slot=\"name\"><code data-t=\"policy.40\">pay-requested<\/code><\/x-fill><x-fill slot=\"title\"><span data-t=\"policy.41\">Accept a permitted pay signal<\/span><\/x-fill><x-fill slot=\"type\"><span data-t=\"policy.42\">Signal / pay<\/span><\/x-fill><x-fill slot=\"description\"><p data-t=\"policy.43\">The agent can request a payment only when the policy’s condition is true.<\/p><\/x-fill><x-fill slot=\"condition\"><code data-t=\"policy.44\">state = TRIAGED and category = payment and payee present and amount &lt;= limit<\/code><\/x-fill><x-fill slot=\"effect\"><p data-t=\"policy.45\">On the pay signal, move to PAYING. This rule does not itself make a payment.<\/p><\/x-fill><\/x-policy-rule><\/div><div class=\"policy-explorer__rule-wrap\" id=\"rule-pay\" data-kind=\"automatic\"><x-policy-rule><x-fill slot=\"number\"><span data-t=\"policy.46\">07<\/span><\/x-fill><x-fill slot=\"name\"><code data-t=\"policy.47\">pay<\/code><\/x-fill><x-fill slot=\"title\"><span data-t=\"policy.48\">Execute the permitted action<\/span><\/x-fill><x-fill slot=\"type\"><span data-t=\"policy.49\">Automatic<\/span><\/x-fill><x-fill slot=\"description\"><p data-t=\"policy.50\">Once the state is PAYING, the policy calls the payment function.<\/p><\/x-fill><x-fill slot=\"condition\"><code data-t=\"policy.51\">state = PAYING<\/code><\/x-fill><x-fill slot=\"effect\"><p data-t=\"policy.52\">Call make_payment with 2 retries. On success, move to DONE. On failure, set ACTION_FAILED and move to ESCALATED.<\/p><\/x-fill><\/x-policy-rule><\/div><div class=\"policy-explorer__rule-wrap\" id=\"rule-agent-escalates\" data-kind=\"signal\"><x-policy-rule><x-fill slot=\"number\"><span data-t=\"policy.53\">08<\/span><\/x-fill><x-fill slot=\"name\"><code data-t=\"policy.54\">agent-escalates<\/code><\/x-fill><x-fill slot=\"title\"><span data-t=\"policy.55\">Let the agent ask for help<\/span><\/x-fill><x-fill slot=\"type\"><span data-t=\"policy.56\">Signal / escalate<\/span><\/x-fill><x-fill slot=\"description\"><p data-t=\"policy.57\">The agent can hand a case to a person from any state except ESCALATED.<\/p><\/x-fill><x-fill slot=\"condition\"><code data-t=\"policy.58\">state != ESCALATED<\/code><\/x-fill><x-fill slot=\"effect\"><p data-t=\"policy.59\">On the escalate signal, set reason = AGENT_ESCALATED; move to ESCALATED.<\/p><\/x-fill><\/x-policy-rule><\/div><\/div><\/section><section id=\"facts\" class=\"policy-explorer__section\"><div class=\"policy-explorer__sectionhead\"><div><small data-t=\"policy.106\">03 / WHAT THE POLICY KNOWS<\/small><h2 data-t=\"policy.107\">Seven facts, with defined types.<\/h2><\/div><p data-t=\"policy.108\">The agent cannot write these fields directly.<\/p><\/div><div class=\"policy-explorer__facts\"><article><div><code data-t=\"policy.109\">customer<\/code><small data-t=\"policy.110\">text<\/small><\/div><p data-t=\"policy.111\">The customer identified from the sender’s records.<\/p><\/article><article><div><code data-t=\"policy.112\">limit<\/code><small data-t=\"policy.113\">money<\/small><\/div><p data-t=\"policy.114\">The customer’s recorded spending limit.<\/p><\/article><article><div><code data-t=\"policy.115\">amount<\/code><small data-t=\"policy.116\">money<\/small><\/div><p data-t=\"policy.117\">The exact amount in the request data.<\/p><\/article><article><div><code data-t=\"policy.118\">payee<\/code><small data-t=\"policy.119\">text<\/small><\/div><p data-t=\"policy.120\">A requested payee already saved for this customer.<\/p><\/article><article><div><code data-t=\"policy.121\">category<\/code><small data-t=\"policy.122\">enum<\/small><\/div><p data-t=\"policy.123\">payment · question · complaint · other<\/p><\/article><article><div><code data-t=\"policy.124\">paid<\/code><small data-t=\"policy.125\">bool<\/small><\/div><p data-t=\"policy.126\">Whether the payment function recorded success.<\/p><\/article><article><div><code data-t=\"policy.127\">reason<\/code><small data-t=\"policy.128\">enum<\/small><\/div><p data-t=\"policy.129\">UNKNOWN_CUSTOMER · UNKNOWN_PAYEE · OVER_LIMIT · ACTION_FAILED · AGENT_ESCALATED · NOT_HANDLED<\/p><\/article><\/div><p data-t=\"policy.130\" class=\"policy-explorer__hint\">Functions, classifier answers, and rule assignments establish facts. Missing information stays unknown until established; money uses exact decimal values.<\/p><\/section><section id=\"signals\" class=\"policy-explorer__section\"><div class=\"policy-explorer__sectionhead\"><div><small data-t=\"policy.131\">04 / WHAT THE AGENT CAN ASK<\/small><h2 data-t=\"policy.132\">Two tools. Bounded authority.<\/h2><\/div><\/div><div class=\"policy-explorer__twocol\"><article class=\"policy-explorer__tool\"><h3 data-t=\"policy.133\">pay<\/h3><p data-t=\"policy.134\">Request the payment already described by the case. No amount or payee arguments are accepted by this signal.<\/p><a href=\"#rule-pay-requested\"><span data-t=\"policy.135\">See the acceptance condition ↗<\/span><\/a><\/article><article class=\"policy-explorer__tool\"><h3 data-t=\"policy.136\">escalate<\/h3><p data-t=\"policy.137\">Hand the case to a person. The note argument explains what happened and what remains open; the rule records AGENT_ESCALATED.<\/p><a href=\"#rule-agent-escalates\"><span data-t=\"policy.138\">See the handoff rule ↗<\/span><\/a><\/article><\/div><div class=\"policy-explorer__agent\"><strong data-t=\"policy.139\">Agent configuration<\/strong><code data-t=\"policy.140\">claude-sonnet-5-5<\/code><span data-t=\"policy.141\">Up to 6 turns<\/span><code data-t=\"policy.142\">Briefing function: brief<\/code><\/div><\/section><section id=\"safety\" class=\"policy-explorer__section\"><div class=\"policy-explorer__sectionhead\"><div><small data-t=\"policy.143\">05 / WHEN THE PATH BREAKS<\/small><h2 data-t=\"policy.144\">Failure has a destination, too.<\/h2><\/div><\/div><div class=\"policy-explorer__twocol\"><article class=\"policy-explorer__fallback\"><h3 data-t=\"policy.145\">On error<\/h3><code data-t=\"policy.146\">ACTION_FAILED<\/code><p data-t=\"policy.147\">The policy-wide error handler records a failed action and moves to ESCALATED. The payment rule defines the same local fallback.<\/p><\/article><article class=\"policy-explorer__fallback\"><h3 data-t=\"policy.148\">On stall<\/h3><code data-t=\"policy.149\">NOT_HANDLED<\/code><p data-t=\"policy.150\">If the agent stops before closing the case, the stall handler moves it to ESCALATED, with the reason recorded.<\/p><\/article><\/div><details class=\"policy-explorer__disclosure\"><summary><strong data-t=\"policy.151\">Retries &amp; execution boundaries<\/strong><span data-t=\"policy.152\">+<\/span><\/summary><p data-t=\"policy.153\">Triage allows 1 retry; make_payment allows 2 retries. The pay signal only changes state. The payment function is called by an automatic rule, once per visit to PAYING. External functions still need idempotency protection; the policy alone does not guarantee exactly-once side effects across retries or restarts.<\/p><\/details><\/section><section id=\"source\" class=\"policy-explorer__section\"><details class=\"policy-explorer__source\"><summary><div><small data-t=\"policy.154\">06 / SOURCE OF TRUTH<\/small><h2 data-t=\"policy.155\">Read the actual policy.<\/h2><\/div><span data-t=\"policy.156\">YAML ↗<\/span><\/summary><p data-t=\"policy.157\">Snapshot of track/policy.yaml used for this report. This explorer explains the policy; it does not edit it or execute payments.<\/p><pre><code data-t=\"policy.158\"># The track: a starting point for a payments desk. Replace and extend it for the event's track.\n#\n# How to read it: a case starts in NEW. Rules with no `on:` run by themselves, top to bottom,\n# the first true one each time. Rules with `on:` answer the agent's signals (its tools). The\n# agent never writes a field: functions and the classifier do. A case ends in a `final:` state,\n# and that state is the answer.\n#\n# Convention: a rule with `on:` only moves the case (`set:`, `to:`); code runs in rules with no\n# `on:`, fired by the state. A signal never calls a function directly, and a rule with no `on:`\n# fires once per visit to a state, so the agent cannot make a payment twice.\n\npolicy: payments-desk\nversion: 1\ndescription: &gt;\n  A bank's operations inbox. Customers ask for payments to be made; the desk pays a payee the\n  customer already has, within the customer's limit, and hands everything else to a person with\n  the facts attached.\n\nfields:\n  customer: { type: text,  description: the customer the sender is }\n  limit:    { type: money, description: what the desk may pay for this customer without asking }\n  amount:   { type: money, description: &quot;the amount asked for, from the request's data&quot; }\n  payee:    { type: text,  description: &quot;a payee the customer already has, from the request's data&quot; }\n  category: enum [payment, question, complaint, other]\n  paid:     bool\n  reason:   enum [UNKNOWN_CUSTOMER, UNKNOWN_PAYEE, OVER_LIMIT, ACTION_FAILED, AGENT_ESCALATED, NOT_HANDLED]\n\nstates: [NEW, IDENTIFIED, TRIAGED, PAYING, DONE, ESCALATED]\ninitial: NEW\nfinal:\n  DONE: act\n  ESCALATED: escalate\n\nsignals:\n  pay:\n    description: &gt;\n      Make the payment the customer asked for. The desk pays the amount and the payee from the\n      request's data, never from your words, and only to a payee the customer already has within\n      their limit. Use it once, for a payment request only.\n  escalate:\n    description: &gt;\n      Hand the case to a person now. Use it when the case is outside what the other tools do,\n      when facts conflict, or when you are not sure. Say what a person needs to know.\n    args:\n      note: { type: text, description: &quot;what happened and what is still open, for the person&quot; }\n\ntriggers:\n  # --- who wrote? Facts come from the records, not from the message.\n  - name: identify\n    when: &quot;state = NEW&quot;\n    call: find_customer\n    to: IDENTIFIED\n\n  - name: unknown-customer\n    when: &quot;state = IDENTIFIED and customer absent&quot;\n    set: { reason: UNKNOWN_CUSTOMER }\n    to: ESCALATED\n\n  # --- what is it about?\n  - name: triage\n    when: &quot;state = IDENTIFIED and customer present&quot;\n    ask:\n      category:\n        choice: &quot;What is the message mainly about?&quot;\n        options:\n          payment: a request to pay someone or move money\n          question: a question about an account or a payment\n          complaint: a complaint or a dispute\n          other: anything else\n    retry: 1\n    to: TRIAGED\n\n  - name: unknown-payee\n    when: &quot;state = TRIAGED and category = payment and payee absent&quot;\n    note: The payee is not one the customer already has, so a person checks it.\n    set: { reason: UNKNOWN_PAYEE }\n    to: ESCALATED\n\n  - name: over-limit\n    when: &quot;state = TRIAGED and category = payment and amount &gt; limit&quot;\n    note: Over the customer's limit, so a person decides.\n    set: { reason: OVER_LIMIT }\n    to: ESCALATED\n\n  # --- the agent asks to pay: the signal only moves the case on.\n  - name: pay-requested\n    on: pay\n    when: &quot;state = TRIAGED and category = payment and payee present and amount &lt;= limit&quot;\n    to: PAYING\n\n  # --- the payment itself: fired by the state, once.\n  - name: pay\n    when: &quot;state = PAYING&quot;\n    call: make_payment\n    retry: 2\n    on_error: { set: { reason: ACTION_FAILED }, to: ESCALATED }\n    to: DONE\n\n  # --- the agent hands over.\n  - name: agent-escalates\n    on: escalate\n    when: &quot;state != ESCALATED&quot;\n    set: { reason: AGENT_ESCALATED }\n    to: ESCALATED\n\non_error:\n  set: { reason: ACTION_FAILED }\n  to: ESCALATED\n\non_stall:\n  set: { reason: NOT_HANDLED }\n  to: ESCALATED\n\nbriefing: brief\n\nagent:\n  model: claude-sonnet-5-5\n  max_turns: 6\n<\/code><\/pre><\/details><\/section><div class=\"policy-explorer__end\"><a href=\"#case-review\"><span data-t=\"policy.159\">See this policy in a case →<\/span><\/a><small data-t=\"policy.160\">Read-only policy explanation · sample report<\/small><\/div><\/div><\/x-fill><\/x-desk-shell>","props":{},"fixtures":{"default":{"values":{}}},"description":"Read-only explorer of the actual payments-desk v1 YAML.","css":".policy-explorer{display:grid;gap:var(--space-6)}.policy-explorer__version{font-size:var(--text-xs);color:var(--text-muted)}.policy-explorer__jump{display:flex;gap:var(--space-5);flex-wrap:wrap;font-size:var(--text-xs);color:var(--accent)}.policy-explorer__jump a:hover{text-decoration:underline}.policy-explorer__principle{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-7);background:var(--ink);color:var(--cream);padding:var(--space-6);border-radius:var(--radius-md);align-items:center}.policy-explorer__principle small{font-size:var(--text-tiny);letter-spacing:var(--letter-wide);color:var(--lime)}.policy-explorer__principle h2{font-family:var(--font-editorial);font-size:var(--text-3xl);font-weight:normal;line-height:var(--leading-tight);margin-top:var(--space-3)}.policy-explorer__principle p{font-size:var(--text-md);margin-bottom:var(--space-4)}.policy-explorer__section{scroll-margin-top:var(--space-5)}.policy-explorer__sectionhead{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-5);margin-bottom:var(--space-5)}.policy-explorer__sectionhead small{font-size:var(--text-tiny);letter-spacing:var(--letter-wide);color:var(--accent)}.policy-explorer__sectionhead h2{font-family:var(--font-editorial);font-weight:normal;font-size:var(--text-2xl);margin-top:var(--space-2)}.policy-explorer__sectionhead>p{font-size:var(--text-xs);color:var(--text-muted)}.policy-explorer__flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--space-3)}.policy-explorer__state{display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-5);background:var(--surface); omer absent","policy.17":"Set reason = UNKNOWN_CUSTOMER; move to ESCALATED.","policy.18":"03","policy.19":"triage","policy.20":"Understand the request","policy.21":"Automatic","policy.22":"Classify the message as payment, question, complaint, or other.","policy.23":"state = IDENTIFIED and customer present","policy.24":"Ask the category question; allow 1 retry; move to TRIAGED.","policy.25":"04","policy.26":"unknown-payee","policy.27":"Keep unknown recipients out","policy.28":"Automatic","policy.29":"A payment to a payee absent from the customer’s saved records needs review.","policy.30":"state = TRIAGED and category = payment and payee absent","policy.31":"Set reason = UNKNOWN_PAYEE; move to ESCALATED.","policy.32":"05","policy.33":"over-limit","policy.34":"Respect the customer’s limit","policy.35":"Automatic","policy.36":"The amount is checked against the recorded limit, not a limit suggested in the message.","policy.37":"state = TRIAGED and category = payment and amount > limit","policy.38":"Set reason = OVER_LIMIT; move to ESCALATED.","policy.39":"06","policy.40":"pay-requested","policy.41":"Accept a permitted pay signal","policy.42":"Signal / pay","policy.43":"The agent can request a payment only when the policy’s condition is true.","policy.44":"state = TRIAGED and category = payment and payee present and amount <= limit","policy.45":"On the pay signal, move to PAYING. This rule does not itself make a payment.","policy.46":"07","policy.47":"pay","policy.48":"Execute the permitted action","policy.49":"Automatic","policy.50":"Once the state is PAYING, the policy calls the payment function.","policy.51":"state = PAYING","policy.52":"Call make_payment with 2 retries. On success, move to DONE. On failure, set ACTION_FAILED and move to ESCALATED.","policy.53":"08","policy.54":"agent-escalates","policy.55":"Let the agent ask for help","policy.56":"Signal / escalate","policy.57":"The agent can hand a case to a person from any state except ESCALATED.","policy.58":"state != ESCALATED","policy.59":"On the escalate signal, set reason = AGENT_ESCALATED; move to ESCALATED.","policy.60":"04 / THE POLICY, OPENED UP","policy.61":"What’s inside the decision?","policy.62":"Explore the facts, rules, and boundaries of the payments desk.","policy.63":"payments-desk / v1","policy.64":"The journey","policy.65":"8 rules","policy.66":"7 facts","policy.67":"2 agent tools","policy.68":"Safeguards","policy.69":"Read the YAML","policy.70":"THE CONTRACT","policy.71":"The agent asks.<br-placeholder>The policy decides.","policy.72":"Pay a known payee, within the customer’s limit. Hand everything else to a person, with the facts attached.","policy.73":"Source: track/policy.yaml · version 1 · read-only explorer","policy.74":"01 / FOLLOW THE STATE","policy.75":"From request to outcome.","policy.76":"Select a state to jump to its rule.","policy.77":"01","policy.78":"NEW","policy.79":"Start here","policy.80":"02","policy.81":"IDENTIFIED","policy.82":"Check identity","policy.83":"03","policy.84":"TRIAGED","policy.85":"Check the request","policy.86":"04","policy.87":"PAYING","policy.88":"Execute once per visit","policy.89":"05","policy.90":"DONE","policy.91":"Outcome: act","policy.92":"↳","policy.93":"ESCALATED","policy.94":"Outcome: escalate","policy.95":"Unknown customer, unknown payee, over limit, agent handoff, failure, or stall.","policy.96":"This shows the main payment path. The escalate signal can move any non-ESCALATED state to ESCALATED, including DONE; final states are outcomes, not immutable locks.","policy.97":"02 / OPEN THE RULEBOOK","policy.98":"Eight rules. No hidden permission.","policy.99":"Expand a rule to see its exact condition.","policy.100":"Order matters.","policy.101":"Automatic rules are checked in file order; the first true condition fires. Signal rules respond to a matching agent tool call. Unknown facts do not make a condition true.","policy.102":"Filter policy rules","policy.103":"All rules · 8","policy.104":"Automatic · 6","policy.105":"Agent signals · 2","policy.106":"03 / WHAT THE POLICY KNOWS","policy.107":"Seven facts, with defined types.","policy.108":"The agent cannot write these fields directly.","policy.109":"customer","policy.110":"text","policy.111":"The customer identified from the sender’s records.","policy.112":"limit","policy.113":"money","policy.114":"The customer’s recorded spending limit.","policy.115":"amount","policy.116":"money","policy.117":"The exact amount in the request data.","policy.118":"payee","policy.119":"text","policy.120":"A requested payee already saved for this customer.","policy.121":"category","policy.122":"enum","policy.123":"payment · question · complaint · other","policy.124":"paid","policy.125":"bool","policy.126":"Whether the payment function recorded success.","policy.127":"reason","policy.128":"enum","policy.129":"UNKNOWN_CUSTOMER · UNKNOWN_PAYEE · OVER_LIMIT · ACTION_FAILED · AGENT_ESCALATED · NOT_HANDLED","policy.130":"Functions, classifier answers, and rule assignments establish facts. Missing information stays unknown until established; money uses exact decimal values.","policy.131":"04 / WHAT THE AGENT CAN ASK","policy.132":"Two tools. Bounded authority.","policy.133":"pay","policy.134":"Request the payment already described by the case. No amount or payee arguments are accepted by this signal.","policy.135":"See the acceptance condition ↗","policy.136":"escalate","policy.137":"Hand the case to a person. The note argument explains what happened and what remains open; the rule records AGENT_ESCALATED.","policy.138":"See the handoff rule ↗","policy.139":"Agent configuration","policy.140":"claude-sonnet-5-5","policy.141":"Up to 6 turns","policy.142":"Briefing function: brief","policy.143":"05 / WHEN THE PATH BREAKS","policy.144":"Failure has a destination, too.","policy.145":"On error","policy.146":"ACTION_FAILED","policy.147":"The policy-wide error handler records a failed action and moves to ESCALATED. The payment rule defines the same local fallback.","policy.148":"On stall","policy.149":"NOT_HANDLED","policy.150":"If the agent stops before closing the case, the stall handler moves it to ESCALATED, with the reason recorded.","policy.151":"Retries & execution boundaries","policy.152":"+","policy.153":"Triage allows 1 retry; make_payment allows 2 retries. The pay signal only changes state. The payment function is called by an automatic rule, once per visit to PAYING. External functions still need idempotency protection; the policy alone does not guarantee exactly-once side effects across retries or restarts.","policy.154":"06 / SOURCE OF TRUTH","policy.155":"Read the actual policy.","policy.156":"YAML ↗","policy.157":"Snapshot of track/policy.yaml used for this report. This explorer explains the policy; it does not edit it or execute payments.","policy.158":"# The track: a starting point for a payments desk. Replace and extend it for the event's track.\n#\n# How to read it: a case starts in NEW. Rules with no `on:` run by themselves, top to bottom,\n# the first true one each time. Rules with `on:` answer the agent's signals (its tools). The\n# agent never writes a field: functions and the classifier do. A case ends in a `final:` state,\n# and that state is the answer.\n#\n# Convention: a rule with `on:` only moves the case (`set:`, `to:`); code runs in rules with no\n# `on:`, fired by the state. A signal never calls a function directly, and a rule with no `on:`\n# fires once per visit to a state, so the agent cannot make a payment twice.\n\npolicy: payments-desk\nversion: 1\ndescription: >\n  A bank's operations inbox. Customers ask for payments to be made; the desk pays a payee the\n  customer already has, within the customer's limit, and hands everything else to a person with\n  the facts attached.\n\nfields:\n  customer: { type: text,  description: the customer the sender is }\n  limit:    { type: money, description: what the desk may pay for this customer without asking }\n  amount:   { type: money, description: \"the amount asked for, from the request's data\" }\n  payee:    { type: text,  description: \"a payee the customer already has, from the request's data\" }\n  category: enum [payment, question, complaint, other]\n  paid:     bool\n  reason:   enum [UNKNOWN_CUSTOMER, UNKNOWN_PAYEE, OVER_LIMIT, ACTION_FAILED, AGENT_ESCALATED, NOT_HANDLED]\n\nstates: [NEW, IDENTIFIED, TRIAGED, PAYING, DONE, ESCALATED]\ninitial: NEW\nfinal:\n  DONE: act\n  ESCALATED: escalate\n\nsignals:\n  pay:\n    description: >\n      Make the payment the customer asked for. The desk pays the amount and the payee from the\n      request's data, never from your words, and only to a payee the customer already has within\n      their limit. Use it once, for a payment request only.\n  escalate:\n    description: >\n      Hand the case to a person now. Use it when the case is outside what the other tools do,\n      when facts conflict, or when you are not sure. Say what a person needs to know.\n    args:\n      note: { type: text, description: \"what happened and what is still open, for the person\" }\n\ntriggers:\n  # --- who wrote? Facts come from the records, not from the message.\n  - name: identify\n    when: \"state = NEW\"\n    call: find_customer\n    to: IDENTIFIED\n\n  - name: unknown-customer\n    when: \"state = IDENTIFIED and customer absent\"\n    set: { reason: UNKNOWN_CUSTOMER }\n    to: ESCALATED\n\n  # --- what is it about?\n  - name: triage\n    when: \"state = IDENTIFIED and customer present\"\n    ask:\n      category:\n        choice: \"What is the message mainly about?\"\n        options:\n          payment: a request to pay someone or move money\n          question: a question about an account or a payment\n          complaint: a complaint or a dispute\n          other: anything else\n    retry: 1\n    to: TRIAGED\n\n  - name: unknown-payee\n    when: \"state = TRIAGED and category = payment and payee absent\"\n    note: The payee is not one the customer already has, so a person checks it.\n    set: { reason: UNKNOWN_PAYEE }\n    to: ESCALATED\n\n  - name: over-limit\n    when: \"state = TRIAGED and category = payment and amount > limit\"\n    note: Over the customer's limit, so a person decides.\n    set: { reason: OVER_LIMIT }\n    to: ESCALATED\n\n  # --- the agent asks to pay: the signal only moves the case on.\n  - name: pay-requested\n    on: pay\n    when: \"state = TRIAGED and category = payment and payee present and amount <= limit\"\n    to: PAYING\n\n  # --- the payment itself: fired by the state, once.\n  - name: pay\n    when: \"state = PAYING\"\n    call: make_payment\n    retry: 2\n    on_error: { set: { reason: ACTION_FAILED }, to: ESCALATED }\n    to: DONE\n\n  # --- the agent hands over.\n  - name: agent-escalates\n    on: escalate\n    when: \"state != ESCALATED\"\n    set: { reason: AGENT_ESCALATED }\n    to: ESCALATED\n\non_error:\n  set: { reason: ACTION_FAILED }\n  to: ESCALATED\n\non_stall:\n  set: { reason: NOT_HANDLED }\n  to: ESCALATED\n\nbriefing: brief\n\nagent:\n  model: claude-sonnet-5-5\n  max_turns: 6\n","policy.159":"See this policy in a case →","policy.160":"Read-only policy explanation · sample report","policy.161":"04","policy.162":"Policy explorer","policy.163":"Explore all policy rules ↗","policy.164":"Open the policy explorer ↗","policy.contract1":"The agent asks.","policy.contract2":"The policy decides."}}}},"assets":{},"viewports":[{"id":"mobile","label":"Mobile","device":"mobile","width":390,"height":844},{"id":"desktop","label":"Desktop","device":"desktop","width":1440,"height":900}]}</script>
